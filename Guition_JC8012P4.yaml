########################################################
# DISPLAY / TOUCH (JC8012P4A1) + LVGL DASHBOARD (800x1280)
########################################################

# --- Touchscreen (GSL3680) ---
touchscreen:
  - platform: gsl3680
    id: touchscreen_
    i2c_id: bus_a
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: true
    on_touch:
      - script.execute: wake_display
    on_release:
      - script.execute: wake_display

# --- Display (MIPI DSI) ---
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_display
    update_interval: never
    reset_pin: GPIO27
    rotation: 180
    auto_clear_enabled: false
    color_order: RGB
    dimensions:
      width: 800
      height: 1280

########################################################
# SCRIPTS: SLEEP / WAKE + MODALS + NAV
########################################################

script:
  - id: arm_display_sleep
    mode: restart
    then:
      - lambda: |-
          id(screen_sleep_secs_left) = id(screen_sleep_secs_cfg);

  - id: wake_display
    mode: restart
    then:
      - script.execute: arm_display_sleep
      - switch.turn_off: switch_antiburn
      - light.turn_on: backlight
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

  - id: screen_sleep_display
    mode: restart
    then:
      - lambda: |-
          id(screen_sleep_secs_left) = 0;
      - switch.turn_on: switch_antiburn
      - lvgl.pause:
          show_snow: true
      - light.turn_off: backlight

  - id: show_api_modal
    mode: restart
    then:
      - lvgl.widget.show: modal_api_bg
      - lvgl.widget.redraw: modal_api_bg

  - id: hide_api_modal
    mode: restart
    then:
      - lvgl.widget.hide: modal_api_bg

  - id: show_battery_modal
    mode: restart
    then:
      - lvgl.widget.show: modal_battery_bg
      - lvgl.widget.redraw: modal_battery_bg

  - id: hide_battery_modal
    mode: restart
    then:
      - lvgl.widget.hide: modal_battery_bg

  - id: switch_to_main_page
    mode: restart
    then:
      - lambda: |-
          id(current_page) = 0;
      - lvgl.page.show:
          id: main_page




########################################################
# LVGL UI
########################################################

lvgl:
  displays:
    - main_display
  touchscreens:
    - touchscreen_
  color_depth: 16
  buffer_size: 25%
  log_level: INFO

  byte_order: little_endian


  style_definitions:

    - id: bar_style
      bg_color: 0x0F0F0F
      bg_opa: COVER
      border_color: 0x1A1A1A
      border_width: 1
      radius: 0
      pad_all: 0
      text_color: 0xFFFFFF

    - id: accent_button
