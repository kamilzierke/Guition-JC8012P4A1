# ==================================================================================================
# Guition JC8012P4 (10.1") – PODSUMOWANIE SPRZĘTU + PINOUT (na podstawie TEJ konfiguracji YAML)
# ==================================================================================================
#
# UWAGA O ROZDZIELCZOŚCI:
# - W pliku występuje "12800x800" / "12800x800" w friendly_name/comment, ale realnie w konfiguracji
#   i w driverze MIPI-DSI ustawiasz: width=800, height=1280 (czyli 800x1280, portrait).
#
# PLATFORM / MCU:
# - SoC główny: ESP32-P4 (board: esp32-p4-evboard), CPU: 400MHz, framework: ESP-IDF
# - Flash: 16MB
# - PSRAM: włączona, 200MHz
# - LDO: esp_ldo channel 3 @ 2.5V (zasilanie MIPI DSI – VDDSDIO 2.5V)
#
# ŁĄCZNOŚĆ:
# - Sieć (Wi-Fi 6 / BLE): ESP32-C6 jako coprocessor po SDIO (esp32_hosted variant: ESP32C6)
# - Tryb AP fallback: włączony (captive portal + web_server)
#
# WYŚWIETLACZ / UI:
# - Panel: 10.1" 800x1280, sterowanie: mipi_dsi (external component: willumpie82/esphome@dev)
# - LVGL: planowane (sekcja zakomentowana)
#
# DOTYK:
# - Kontroler: gsl3680 (external component: kvj/esphome@jd9365_gsl3680)
# - I2C skan: włączony, 400kHz
# - Wykryte adresy I2C (zdefiniowane w i2c_device): 0x18, 0x32, 0x36, 0x40
#
# AUDIO:
# - DAC/codec: ES8311 (sekcja zakomentowana)
# - I2S: zadeklarowane piny (sekcja zakomentowana)
#
# POMIARY BATERII:
# - ADC Battery voltage: GPIO52, attenuation 12dB, *1.68 (dzielnik/skalowanie)
# - Dodatkowa logika: OCV→SOC, estymacje %/h i czasu pracy (software)
#
# DEBUG/DIAGNOSTYKA:
# - logger: USB Serial/JTAG, level=debug
# - debug sensor: heap/psram/cpu/loop_time itd.
#
# ==================================================================================================
# PINOUT – MAPA FUNKCJI ↔ GPIO (WEDŁUG TEGO YAML)
# ==================================================================================================
#
# A) ESP32-C6 “HOSTED” (SDIO) – esp32_hosted:
# - GPIO54 : C6_RESET
# - GPIO19 : SDIO_CMD
# - GPIO18 : SDIO_CLK
# - GPIO14 : SDIO_D0
# - GPIO15 : SDIO_D1
# - GPIO16 : SDIO_D2
# - GPIO17 : SDIO_D3
#
# B) Podświetlenie LCD (PWM):
# - GPIO23 : LCD_BACKLIGHT_PWM (LEDC channel 0, 1kHz) → light: monochromatic "Backlight"
#
# C) I2C (Touch / peryferia na bus_a):
# - GPIO7  : I2C_SDA (bus_a)
# - GPIO8  : I2C_SCL (bus_a)
# - Adresy (zdefiniowane): 0x18 / 0x32 / 0x36 / 0x40
#
# D) Touchscreen GSL3680 (sekcja zakomentowana, ale piny zadeklarowane):
# - GPIO22 : TOUCH_RESET
# - GPIO21 : TOUCH_INT
#
# E) Display MIPI-DSI (sekcja zakomentowana, ale pin zadeklarowany):
# - GPIO27 : DISPLAY_RESET
# - MIPI-DSI lane/pins: N/D (linie MIPI nie są mapowane jako klasyczne GPIO w YAML)
#
# F) Audio / I2S (sekcje zakomentowane, ale piny zadeklarowane):
# - GPIO10 : I2S_LRCLK
# - GPIO12 : I2S_BCLK
# - GPIO13 : I2S_MCLK
# - GPIO9  : I2S_DOUT (speaker)
# - GPIO11 : I2S_DIN  (microphone)
#
# G) ADC – pomiar napięcia baterii:
# - GPIO52 : ADC_BATT_V
#
# ==================================================================================================
# KONFLIKTY / RYZYKA KONFIGURACYJNE (wynikające z tej mapy)
# ==================================================================================================
#
# 1) GPIO52 jest użyty jako ADC_BATT_V.
#    Jeśli na tej platformie GPIO52 jest jednocześnie MDIO Ethernet PHY (częsty przypadek w P4 EVB),
#    to będzie konflikt funkcji (ADC vs MDIO). W tym YAML nie masz ethernet:, ale sprzęt może mieć PHY.
#
# 2) Touch/Display/Audio są obecnie zakomentowane – ich piny nie są aktywne w runtime, ale są częścią
#    planowanego pinoutu.
#
# ==================================================================================================
# ZALEŻNOŚCI / KOMPONENTY ZEWNĘTRZNE (ważne dla kompilacji)
# ==================================================================================================
# - mipi_dsi: github://willumpie82/esphome@dev  (components: mipi_dsi)
# - gsl3680:  github://kvj/esphome@jd9365_gsl3680 (components: gsl3680, refresh: 0s)
# ==================================================================================================



substitutions:
  devicename: "guitionhmi-04"
  friendly: "Guition 04 - JC8012P4 (10.1in 12800x800)"
  tz: Europe/Warsaw
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"
  touchscreen_idle_timeout: "30s"
  touchscreen_daytime_brightness: "100%"
  touchscreen_nighttime_brightness: "50%"
  boot_screen_delay: 60s
  screen_night_hour: '0'
  screen_night_minute: '0'
  screen_height: 1280
  screen_width: 800
  

external_components:  
  - source: github://willumpie82/esphome@dev
    components: [mipi_dsi]
  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [gsl3680]


esphome:
  name: "guitionhmi-04"
  friendly_name: "Guition JC8012P4 (10.1 inch, 1280x800)"
  min_version: 2025.12.0
  comment: "Main:ESP32-P4, Network:ESP32-C6, Camera:OV02C10, Touchscreen:GSL3680, Audio: ES8311, "
  on_boot:
    priority: -100
    then:
      - script.execute: wake_display


esp32:
  board: esp32-p4-evboard
  cpu_frequency: 400MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# Enable debug logging over USB Serial/JTAG
logger:
  level: debug

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
          - lambda: |-
              id(last_ha_connection) = id(homeassistant_time).now().timestamp;
          - lvgl.label.update:
              id: lbl_modal_api_status
              text: "Status: Connected"
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
          - lvgl.label.update:
              id: lbl_modal_api_status
              text: "Status: Disconnected"
ota:
  - platform: esphome
captive_portal:
web_server:
  port: 80
  version: 3



wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "${devicename}"
    password: !secret wifi_fallback_password







# Acquire LDO regulator channel 3 at 2.5V for MIPI DSI power (VDDSDIO 2.5V)
esp_ldo:
  - channel: 3
    voltage: 2.5V

# Configure ESP32-C6 co-processor (WiFi6/BLE) interface over SDIO
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54      # Reset pin for ESP32-C6
  cmd_pin: GPIO19       # SDIO CMD
  clk_pin: GPIO18       # SDIO CLK
  d0_pin: GPIO14        # SDIO D0
  d1_pin: GPIO15        # SDIO D1
  d2_pin: GPIO16        # SDIO D2
  d3_pin: GPIO17        # SDIO D3
  active_high: true


# Use external PSRAM at high speed
psram:
  speed: 200MHz



# LEDC PWM output for LCD backlight (backlight enable pin via transistor or LED driver input)
output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO23         # Backlight control pin
    channel: 0
    frequency: 1000 Hz
    # 16-bit resolution by default

# Backlight as a dimmable light (via PWM)
light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: lcd_backlight_pwm
    default_transition_length: 1s
    gamma_correct: 2.8
    restore_mode: ALWAYS_ON    # Turn on backlight by default on boot
    on_turn_on:
      then:
        - script.execute: wake_display
    on_turn_off:
      then:
        - lambda: |-
            id(screen_sleep_secs_left) = 0;
        - switch.turn_on: switch_antiburn
        - lvgl.pause:
            show_snow: true

# -------------------------------------------
# Touchscreen
# -------------------------------------------

i2c:
  - id: bus_a
    sda: GPIO7  
    scl: GPIO8  
    scan: true
    frequency: 400kHz 
 
i2c_device:
  - id: i2cdev1
    address: 0x18
  - id: i2cdev2
    address: 0x32
  - id: i2cdev3
    address: 0x36
  - id: i2cdev4
    address: 0x40


time:
  - platform: homeassistant
    timezone: ${tz}
    id: homeassistant_time
  - platform: sntp
    id: sntp_time
    timezone: ${tz}
    on_time:
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

debug:
  update_interval: 5s





number:
  - platform: template
    id: screen_sleep_cfg_number
    name: "Ekran: czas uspienia [s]"
    min_value: 5
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 60
    set_action:
      - lambda: |-
          id(screen_sleep_secs_cfg) = (int) x;
      - script.execute: wake_display


text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      on_value:
        - lvgl.label.update:
            id: lbl_modal_api_ip
            text: !lambda |-
              static char buf[64];
              snprintf(buf, sizeof(buf), "IP: %s", x.c_str());
              return buf;
        - lvgl.label.update:
            id: lbl_ip_top
            text: !lambda |-
              static char buf[64];
              snprintf(buf, sizeof(buf), "IP: %s", x.c_str());
              return buf;

    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_name


  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

  - platform: version
    name: "Version"
    icon: mdi:cube-outline

  - platform: homeassistant
    id: ha_calendar_event
    entity_id: calendar.kalendarz_kamila
    on_value:
      - lvgl.textarea.update:
          id: lbl_calendar_event
          text: !lambda |-
            if (x.empty()) {
              return "No events";
            }
            return x.c_str();




  - platform: template
    id: batt_state
    name: "Battery state"
    update_interval: never

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 10s

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 10s
    entity_category: "diagnostic"


  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"

  - platform: template
    id: screen_sleep_left_sensor
    name: "Ekran: pozostały czas [s]"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(screen_sleep_secs_left);

  - platform: adc
    id: batt_v
    name: "Battery voltage"
    pin: GPIO52
    update_interval: 1s
    attenuation: 12dB
    samples: 10
    accuracy_decimals: 2
    filters:
      - multiply: 1.68
    on_value:
      then:
        - lambda: |-
            const float v = x;
            if (isnan(v) || v <= 0.0f) return;
            id(batt_v_sum) += v;
            id(batt_v_cnt) += 1;
            if (v < id(batt_v_min)) id(batt_v_min) = v;
            if (v > id(batt_v_max)) id(batt_v_max) = v;

  # --- SOC z krzywej (OCV→SOC), 3.50V = 0% (critical) ---
  - platform: template
    id: batt_soc
    name: "Battery percent"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      const float v = id(batt_v).state;
      if (isnan(v) || v <= 0.0f) return NAN;

      struct P { float v; float p; };
      static const P pts[] = {
        {4.20f, 100.f},
        {4.15f,  95.f},
        {4.10f,  90.f},
        {4.05f,  85.f},
        {4.00f,  80.f},
        {3.95f,  73.f},
        {3.90f,  65.f},
        {3.85f,  58.f},
        {3.80f,  50.f},
        {3.75f,  40.f},
        {3.70f,  30.f},
        {3.65f,  20.f},
        {3.60f,  10.f},
        {3.55f,   5.f},
        {3.50f,   0.f},
      };

      if (v >= pts[0].v) return 100.f;
      if (v <= pts[sizeof(pts)/sizeof(pts[0]) - 1].v) return 0.f;

      for (size_t i = 0; i < (sizeof(pts)/sizeof(pts[0]) - 1); i++) {
        const float v1 = pts[i].v,     p1 = pts[i].p;
        const float v2 = pts[i+1].v,   p2 = pts[i+1].p;
        if (v <= v1 && v >= v2) {
          const float t = (v - v2) / (v1 - v2);
          const float p = p2 + t * (p1 - p2);
          if (p < 0.f) return 0.f;
          if (p > 100.f) return 100.f;
          return p;
        }
      }
      return NAN;

  # tempo zmian SOC w %/h (wyliczane w interval co 10 min)
  - platform: template
    id: batt_soc_rate
    name: "Battery % rate"
    unit_of_measurement: "%/h"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  # estymacja pozostałego czasu pracy (h)
  - platform: template
    id: batt_time_remaining_h
    name: "Battery time remaining"
    unit_of_measurement: "h"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  # czas do pełna podczas ładowania (h) – opcjonalnie
  - platform: template
    id: batt_time_to_full_h
    name: "Battery time to full"
    unit_of_measurement: "h"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  # 10-minutowe statystyki napięcia (publikowane co 10 min)
  - platform: template
    id: batt_v_avg_10m
    name: "Battery voltage avg 10m"
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: batt_v_min_10m
    name: "Battery voltage min 10m"
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: batt_v_max_10m
    name: "Battery voltage max 10m"
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  # --- HA: Na zewnątrz (temp) ---
  - platform: homeassistant
    id: ha_outside_temp
    entity_id: sensor.esphome_web_68ca18_outside_temp
    on_value:
      - lvgl.label.update:
          id: lbl_outside_temp
          text: !lambda |-
            static char s[24];
            if (isnan(x)) snprintf(s, sizeof(s), "-.-°C");
            else snprintf(s, sizeof(s), "%.1f°C", x);
            return s;

  # --- HA: Średnia temp w domu ---
  - platform: homeassistant
    id: ha_indoor_mean
    entity_id: sensor.indoor_mean
    on_value:
      - lvgl.label.update:
          id: lbl_indoor_mean
          text: !lambda |-
            static char s[24];
            if (isnan(x)) snprintf(s, sizeof(s), "-.-°C");
            else snprintf(s, sizeof(s), "%.1f°C", x);
            return s;

  # --- HA: Salon ---
  - platform: homeassistant
    id: ha_salon_temp
    entity_id: sensor.termometr_parter_salon_kanapa_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_salon_temp
          text: !lambda |-
            static char s[24];
            if (isnan(x)) snprintf(s, sizeof(s), "-.-°C");
            else snprintf(s, sizeof(s), "%.1f°C", x);
            return s;

  # --- HA: Sypialnia (mały pokój) ---
  - platform: homeassistant
    id: ha_sypialnia_temp
    entity_id: sensor.termometr_parter_maly_pokoj_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_sypialnia_temp
          text: !lambda |-
            static char s[24];
            if (isnan(x)) snprintf(s, sizeof(s), "-.-°C");
            else snprintf(s, sizeof(s), "%.1f°C", x);
            return s;

  # --- HA: Łazienka ---
  - platform: homeassistant
    id: ha_lazienka_temp
    entity_id: sensor.termometr_parter_lazienka_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_lazienka_temp
          text: !lambda |-
            static char s[24];
            if (isnan(x)) snprintf(s, sizeof(s), "-.-°C");
            else snprintf(s, sizeof(s), "%.1f°C", x);
            return s;
binary_sensor:
  - platform: template
    id: batt_critical
    name: "Battery critical"
    device_class: battery
    lambda: |-
      const float v = id(batt_v).state;
      if (isnan(v)) return false;
      return v <= 3.50f;

  - platform: template
    id: batt_charging
    name: "Battery charging"
    lambda: |-
      const float r = id(batt_soc_rate).state;   // %/h
      if (isnan(r)) return false;
      return r > 0.5f; 

  - platform: template
    id: batt_discharging
    name: "Battery discharging"
    lambda: |-
      const float r = id(batt_soc_rate).state;   // %/h
      if (isnan(r)) return false;
      return r < -0.5f; 


  # --- HA: Drzwi wejściowe ---
  - platform: homeassistant
    id: ha_drzwi_wejsciowe
    entity_id: binary_sensor.drzwi_parter_przedpokoj_drzwi_wejsciowe_contact
    on_state:
      - lvgl.label.update:
          id: lbl_drzwi_wejsciowe
          text: !lambda |-
            return x ? std::string("OTWARTE") : std::string("ZAMKNIETE");


  # --- HA: Okno kuchnia 1 ---
  - platform: homeassistant
    id: ha_okno_kuchnia_1
    entity_id: binary_sensor.parter_kuchnia_okno_1_contact
    on_state:
      - lvgl.label.update:
          id: lbl_okno_kuchnia_1
          text: !lambda |-
            return x ? std::string("OTWARTE") : std::string("ZAMKNIETE");

