switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

########################################################
# UI UPDATE LOOP (time/date + wifi + battery labels + battery modal values)
########################################################

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(screen_sleep_secs_left) > 0) {
            id(screen_sleep_secs_left)--;
            if (id(screen_sleep_secs_left) == 0) {
              id(screen_sleep_display).execute();
            }
          }
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            static char s[16];
            auto t = id(homeassistant_time).now();
            if (!t.is_valid()) t = id(sntp_time).now();
            snprintf(s, sizeof(s), "%02d:%02d:%02d", t.hour, t.minute, t.second);
            return s;

      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            static char s[20];
            auto t = id(homeassistant_time).now();
            if (!t.is_valid()) t = id(sntp_time).now();
            snprintf(s, sizeof(s), "%04d-%02d-%02d", t.year, t.month, t.day_of_month);
            return s;

      # WiFi dBm + %
      - lvgl.label.update:
          id: lbl_wifi_dbm
          text: !lambda |-
            static char s[16];
            const float x = id(wifi_signal_db).state;
            if (isnan(x)) snprintf(s, sizeof(s), "-- dBm");
            else snprintf(s, sizeof(s), "%.0f dBm", x);
            return s;

      - lvgl.label.update:
          id: lbl_wifi_percent
          text: !lambda |-
            static char s[12];
            const float x = id(wifi_signal_percent).state;
            if (isnan(x)) snprintf(s, sizeof(s), "-- %%");
            else snprintf(s, sizeof(s), "%.0f %%", x);
            return s;

      - lvgl.label.update:
          id: lbl_modal_api_wifi_dbm
          text: !lambda |-
            static char s[24];
            const float x = id(wifi_signal_db).state;
            if (isnan(x)) snprintf(s, sizeof(s), "WiFi: -- dBm");
            else snprintf(s, sizeof(s), "WiFi: %.0f dBm", x);
            return s;

      - lvgl.label.update:
          id: lbl_modal_api_wifi_percent
          text: !lambda |-
            static char s[24];
            const float x = id(wifi_signal_percent).state;
            if (isnan(x)) snprintf(s, sizeof(s), "Signal: --%%");
            else snprintf(s, sizeof(s), "Signal: %.0f%%", x);
            return s;

      # Battery % label + battery modal fields
      - lvgl.label.update:
          id: lbl_battery_percent
          text: !lambda |-
            static char s[12];
            const float soc = id(batt_soc).state;
            if (isnan(soc)) snprintf(s, sizeof(s), "-- %%");
            else snprintf(s, sizeof(s), "%.0f %%", soc);
            return s;

      - lvgl.label.update:
          id: lbl_batt_modal_soc
          text: !lambda |-
            static char s[20];
            const float soc = id(batt_soc).state;
            if (isnan(soc)) snprintf(s, sizeof(s), "SOC: -- %%");
            else snprintf(s, sizeof(s), "SOC: %.0f %%", soc);
            return s;

      - lvgl.label.update:
          id: lbl_batt_modal_v
          text: !lambda |-
            static char s[24];
            const float v = id(batt_v).state;
            if (isnan(v)) snprintf(s, sizeof(s), "Voltage: --.- V");
            else snprintf(s, sizeof(s), "Voltage: %.2f V", v);
            return s;

      - lvgl.label.update:
          id: lbl_batt_modal_state
          text: !lambda |-
            static char s[32];
            auto st = id(batt_state).state;
            if (st.empty()) snprintf(s, sizeof(s), "State: --");
            else snprintf(s, sizeof(s), "State: %s", st.c_str());
            return s;

      - lvgl.label.update:
          id: lbl_batt_modal_flags
          text: !lambda |-
            static char s[64];
            const bool crit = id(batt_critical).state;
            const bool chg  = id(batt_charging).state;
            const bool dis  = id(batt_discharging).state;
            snprintf(s, sizeof(s), "Flags: %s%s%s",
              crit ? "CRITICAL " : "",
              chg  ? "CHG "      : "",
              dis  ? "DIS "      : "");
            return s;
      - lvgl.label.update:
          id: lbl_battery_v
          text: !lambda |-
            static char s[16];
            const float v = id(batt_v).state;
            if (isnan(v)) snprintf(s, sizeof(s), "--.-- V");
            else snprintf(s, sizeof(s), "%.2f V", v);
            return s;

  - interval: 10min
    then:
      - lambda: |-
          const uint32_t now = millis();

          const float soc = id(batt_soc).state;
          const float v   = id(batt_v).state;

          // publikuj staty napięcia 10m
          if (id(batt_v_cnt) > 0) {
            const float avg = id(batt_v_sum) / (float)id(batt_v_cnt);
            id(batt_v_avg_10m).publish_state(avg);
            id(batt_v_min_10m).publish_state(id(batt_v_min));
            id(batt_v_max_10m).publish_state(id(batt_v_max));
          }

          // reset agregacji 10m
          id(batt_v_sum) = 0.0f;
          id(batt_v_cnt) = 0;
          id(batt_v_min) = 1000.0f;
          id(batt_v_max) = 0.0f;

          // policz rate %/h (jeśli mamy poprzedni punkt)
          if (!isnan(soc) && id(batt_t_prev_ms) != 0 && !isnan(id(batt_soc_prev))) {
            const float dt_h = (now - id(batt_t_prev_ms)) / 3600000.0f;
            if (dt_h > 0.0f) {
              const float rate = (soc - id(batt_soc_prev)) / dt_h;  // %/h
              id(batt_soc_rate).publish_state(rate);

              // stan + estymacje czasu
              const bool critical = (!isnan(v) && v <= 3.50f);

              if (critical) {
                id(batt_state).publish_state("Critical");
                id(batt_time_remaining_h).publish_state(0.0f);
                id(batt_time_to_full_h).publish_state(NAN);
              } else if (rate < -0.5f) {
                id(batt_state).publish_state("Discharging");
                // remaining hours = soc / (-rate)
                const float rem_h = soc / (-rate);
                id(batt_time_remaining_h).publish_state(rem_h > 0.0f ? rem_h : 0.0f);
                id(batt_time_to_full_h).publish_state(NAN);
              } else if (rate > 0.5f) {
                id(batt_state).publish_state("Charging");
                // time to full = (100 - soc) / rate
                const float to_full_h = (100.0f - soc) / rate;
